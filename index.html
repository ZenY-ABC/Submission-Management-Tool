<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submission Management Tool</title><meta name="theme-color" content="#172033"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:900px;margin:auto;padding:20px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card{background:#fff;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #17203312}.muted{color:#637083}.tabs{display:flex;gap:8px}button{background:#2449c6;color:white;border:0;border-radius:10px;padding:10px 15px;cursor:pointer}.tabs button{background:#e7ebf8;color:#243459}.tabs button.active{background:#2449c6;color:white}.item{border-top:1px solid #e7eaf0;padding:14px 0}.item:first-child{border-top:0}.meta{font-size:13px;color:#637083}a{color:#2449c6}input[type=checkbox]{width:19px;height:19px}textarea{box-sizing:border-box;width:100%;min-height:110px;border:1px solid #cad2e2;border-radius:10px;padding:12px}label{display:flex;gap:10px;align-items:start}.notice{background:#fff7df;padding:12px;border-radius:10px;font-size:13px}.hidden{display:none}</style></head><body><main><header><div><h1>🎓 Submission Management Tool</h1><div class="muted">1年7組 · 自分専用の課題管理</div></div><span id="count"></span></header><div class="card"><div class="tabs"><button id="tasksBtn" class="active" onclick="tab('tasks')">提出物</button><button id="testsBtn" onclick="tab('tests')">テスト返却</button></div><div id="items"></div></div><div class="card"><h2>Gmailから取得</h2><p class="notice">読み取り専用です。メールをGitHubに保存・送信しません。学校のアカウントでログインできない場合は、管理者の制限が考えられます。</p><div class="bar"><button onclick="gmailLogin()">Googleでログイン</button><button onclick="gmailFetch()">Gmailから取得</button></div><p id="gmailStatus" class="muted" role="status">未ログイン</p></div><div class="card"><h2>通知の手動取り込み</h2><p class="muted">Classroom通知メールの件名と本文を貼り付けてください。データはこのブラウザ内に保存されます。</p><textarea id="mail" placeholder="Classroom通知メールの件名と本文を貼り付け"></textarea><div class="bar"><button onclick="add()">解析して追加</button><button onclick="exportData()">データをバックアップ</button><button onclick="document.getElementById('file').click()">バックアップを復元</button><input id="file" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><p id="status" class="muted" role="status"></p></div></main><script src="https://accounts.google.com/gsi/client" async defer></script><script>
const CLIENT_ID='687477360282-riqsgutc28s78gndqdk6te53ivejku50.apps.googleusercontent.com';
const KEY='classhub-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let current='tasks';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isSeven(s){const t=s.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/[－−ー～〜]/g,'-');if(/(?:^|[^0-9])(?:1\s*[-年]\s*7|7\s*組|1-07)(?:[^0-9]|$)/.test(t))return true;const ranges=[...t.matchAll(/(\d{1,2})\s*[-~]\s*(\d{1,2})\s*組/g)];if(ranges.some(m=>+m[1]<=7&&7<=+m[2]))return true;return false}
function tab(v){current=v;document.getElementById('tasksBtn').classList.toggle('active',v==='tasks');document.getElementById('testsBtn').classList.toggle('active',v==='tests');render()}
let selectedIds = new Set();

const SUBJECTS = [
  '数学Ⅰ', '数学A', '英語CⅠ', '論理表現Ⅰ',
  '現代の国語', '言語文化', '生物基礎',
  '化学基礎', '物理基礎', '地理総合',
  '歴史総合', '保健', '家庭基礎', 'アンデレⅠ'
];

let testFilters = {
  term: 'all',
  exam: 'all',
  subject: 'all'
};

function detectSubject(text){
  const aliases = {
    '数学Ⅰ': ['数学Ⅰ','数学I','数学1','数Ⅰ','数I'],
    '数学A': ['数学A','数A'],
    '英語CⅠ': ['英語CⅠ','英語CI','英語C1','コミュニケーション英語'],
    '論理表現Ⅰ': ['論理表現Ⅰ','論理表現I','論理表現1','論表'],
    '現代の国語': ['現代の国語','現国'],
    '言語文化': ['言語文化','言文'],
    '生物基礎': ['生物基礎','生基'],
    '化学基礎': ['化学基礎','化基'],
    '物理基礎': ['物理基礎','物基'],
    '地理総合': ['地理総合','地総'],
    '歴史総合': ['歴史総合','歴総'],
    '保健': ['保健'],
    '家庭基礎': ['家庭基礎','家庭科'],
    'アンデレⅠ': ['アンデレⅠ','アンデレI','アンデレ1']
  };

  for(const [subject,names] of Object.entries(aliases)){
    if(names.some(name=>text.includes(name))) return subject;
  }
  return '未分類';
}

function detectExam(text){
  const normalized = text
    .replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65248))
    .replace(/\s+/g,'');

  const termMatch = normalized.match(/([123])学期/);
  const term = termMatch ? termMatch[1] : 'unknown';

  let exam = 'unknown';

  if(/中間|中間考査|中間試験/.test(normalized)){
    exam = 'mid';
  }else if(/期末|期末考査|期末試験/.test(normalized)){
    exam = 'final';
  }

  return {term,exam};
}

function render(){
  const items = data.filter(x=>
  x.type===current &&
  (current!=='tests' || (
    (testFilters.term==='all' || x.term===testFilters.term) &&
    (testFilters.exam==='all' || x.exam===testFilters.exam) &&
    (testFilters.subject==='all' || x.subject===testFilters.subject)
  ))
)
    .sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));

  document.getElementById('count').textContent =
    `未完了 ${data.filter(x=>x.type==='tasks'&&!x.done).length}件`;

  const selectedCount = items.filter(x=>selectedIds.has(x.id)).length;

  document.getElementById('items').innerHTML = `
  ${current==='tests' ? `
  <div class="bar" style="justify-content:flex-start;gap:6px;padding-left:0;margin-left:0">
    <select onchange="testFilters.term=this.value;render()" value="${testFilters.term}">
      <option value="all" ${testFilters.term==='all'?'selected':''}>全学期</option>
      <option value="1" ${testFilters.term==='1'?'selected':''}>1学期</option>
<option value="2" ${testFilters.term==='2'?'selected':''}>2学期</option>
<option value="3" ${testFilters.term==='3'?'selected':''}>3学期</option>
    </select>
    <select onchange="testFilters.exam=this.value;render()">
      <option value="all" ${testFilters.exam==='all'?'selected':''}>全試験</option>
<option value="mid" ${testFilters.exam==='mid'?'selected':''}>中間考査</option>
<option value="final" ${testFilters.exam==='final'?'selected':''}>期末考査</option>
    </select>
    <select onchange="testFilters.subject=this.value;render()">
      <option value="all" ${testFilters.subject==='all'?'selected':''}>全科目</option>
${SUBJECTS.map(s=>`<option value="${s}" ${testFilters.subject===s?'selected':''}>${s}</option>`).join('')}
    </select>
  </div>
` : ''}
    <div class="bar" style="margin:16px 0">
      <span>削除対象：${selectedCount}件</span>
      <button onclick="deleteSelected()" ${selectedCount===0?'disabled':''}>
        選択した${selectedCount}件を削除
      </button>
    </div>
    ${items.length ? items.map(x=>`
      <div class="item">
        <div style="display:flex;gap:12px;align-items:flex-start">
          <input type="checkbox"
            aria-label="削除対象として選択"
            ${selectedIds.has(x.id)?'checked':''}
            onchange="selectItem('${x.id}',this.checked)">
          <div style="flex:1">
            <strong>${esc(x.title)}</strong>
            <div class="meta">
              ${esc(x.due?'期限 '+x.due:'期限未確認')} · ${esc(x.source)}
            </div>
            ${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">元メール</a>`:''}
            ${x.type==='tasks'?`
              <label style="margin-top:8px">
                <input type="checkbox" ${x.done?'checked':''}
                  onchange="toggle('${x.id}')">
                提出完了
              </label>
            `:''}
            <div style="margin-top:8px">
              <button onclick="removeItem('${x.id}')">1件削除</button>
            </div>
          </div>
        </div>
      </div>
    `).join(''):'<p class="muted">まだ登録がありません。</p>'}
  `;
}

function selectItem(id,checked){
  if(checked) selectedIds.add(id);
  else selectedIds.delete(id);
  render();
}

function deleteSelected(){
  const ids = data.filter(x=>x.type===current&&selectedIds.has(x.id))
    .map(x=>x.id);

  if(!ids.length) return;

  if(!confirm(`${ids.length}件を削除しますか？この操作は元に戻せません。`)){
    return;
  }

  const targets = new Set(ids);
  data = data.filter(x=>!targets.has(x.id));
  ids.forEach(id=>selectedIds.delete(id));
  save();
  render();
}

function toggle(id){const x=data.find(x=>x.id===id);if(x){x.done=!x.done;save();render()}}function removeItem(id){data=data.filter(x=>x.id!==id);save();render()}


function classify(raw){
  const test = raw.includes('この課題はデジタル採点支援システムを使用した');

  const due = raw.match(
    /(?:提出期限|提出締切|締め切り|締切|期限)[:：\s]*([^\n。]{1,35})/
  )?.[1] || '';

  if(test){
    return {
  type:'tests',
  due,
  subject:detectSubject(raw),
  ...detectExam(raw)
};
  }

  const isAssignment =
    /提出|締切|〆切|締め切り|回収|やり直し|自己採点|宿題/.test(raw);

  if(!isAssignment){
    return null;
  }

  return {type:'tasks',due};
}
function add(){const raw=document.getElementById('mail').value.trim(),status=document.getElementById('status');if(!raw){status.textContent='メール本文を入力してください';return}if(!isSeven(raw)){status.textContent='7組対象と確認できませんでした。7組の記載がある通知のみ自動登録します。';return}const result=classify(raw);
if(!result){
  status.textContent='提出物・テスト返却ではないため追加しませんでした。';
  return;
}
const {type,due,subject,term,exam}=result;const title=raw.split('\n').find(s=>s.trim())?.slice(0,140)||'名称未確認';if(data.some(x=>x.title===title&&x.type===type)){status.textContent='同じ名前の通知が登録済みです';return}data.push({
  id:crypto.randomUUID(),
  type,title,due,
  source:'手動取り込み',
  done:false,
  ...(type==='tests'?{
    subject:result.subject,
    term:result.term,
    exam:result.exam
  }:{})
});save();render();status.textContent=type==='tests'?'テスト返却として追加しました':'提出物候補として追加しました。内容を確認してください。';document.getElementById('mail').value=''}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='classhub-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(x=>typeof x.id==='string'&&['tasks','tests'].includes(x.type)&&typeof x.title==='string'))throw Error();data=a;save();render();document.getElementById('status').textContent='復元しました'}catch{document.getElementById('status').textContent='バックアップの形式が正しくありません'}}
let accessToken=null;
function gmailLogin(){const s=document.getElementById('gmailStatus');if(!window.google?.accounts?.oauth2){s.textContent='Google認証を読み込み中です。少し待って再試行してください。';return}google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/gmail.readonly',callback:r=>{if(r.error){s.textContent='認証エラー: '+r.error;return}accessToken=r.access_token;s.textContent='ログインできました。「Gmailから取得」を押してください。'}}).requestAccessToken({prompt:'consent'})}
function decode(s){if(!s)return '';try{const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}catch{return ''}}
function plainParts(p){let a=[];if(p?.mimeType==='text/plain'&&p.body?.data)a.push(decode(p.body.data));for(const child of p?.parts||[])a.push(...plainParts(child));return a}
async function gmailFetch(){const s=document.getElementById('gmailStatus');if(!accessToken){s.textContent='先にGoogleでログインしてください。';return}const api=async path=>{const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path,{headers:{Authorization:'Bearer '+accessToken}});
if(!r.ok){
  const detail = await r.text();
  throw Error('Gmail API '+r.status+': '+detail);
}
return r.json()
  };try{let added=0,skipped=0,page='';s.textContent='メールを取得中…';for(let n=0;n<1;n++){const q='newer_than:120d (from:no-reply@classroom.google.com OR "デジタル採点支援システム")';const list=await api('messages?maxResults=30&q='+encodeURIComponent(q)+(page?'&pageToken='+encodeURIComponent(page):''));for(const item of list.messages||[]){const m=await api('messages/'+encodeURIComponent(item.id)+'?format=full');const subject=m.payload?.headers?.find(h=>h.name.toLowerCase()==='subject')?.value||'';const raw=subject+'\n'+(plainParts(m.payload).join('\n')||m.snippet||'');if(!isSeven(raw)){skipped++;continue}const id='gmail-'+item.id;if(data.some(x=>x.id===id)){skipped++;continue}const result=classify(raw);if(!result){skipped++;continue}const {type,due,subject:detectedSubject,term,exam}=result;data.push({id,type,title:subject.slice(0,140)||'件名なし',due,source:'Gmailから取得',url:'https://mail.google.com/mail/u/0/#all/'+item.id,done:false,
...(type==='tests'?{
  subject:detectedSubject,
  term:term,
  exam:exam
}:{})
});added++}page=list.nextPageToken;if(!page)break;s.textContent='メールを確認中… '+added+'件追加'}save();render();s.textContent=added+'件追加しました。除外・重複 '+skipped+'件。内容を確認してください。'}catch(e){s.textContent='取得できませんでした: '+e.message+'。Gmail APIの有効化や学校アカウントの制限を確認してください。'}}
render();</script></body></html>
