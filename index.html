<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassHub</title><meta name="theme-color" content="#172033"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;color:#172033;margin:0}main{max-width:850px;margin:auto;padding:22px}header,.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #17203312}.muted{color:#637083}.tabs{display:flex;gap:8px}button{background:#2449c6;color:white;border:0;border-radius:10px;padding:10px 15px;cursor:pointer}.tabs button{background:#e7ebf8;color:#243459}.tabs button.active{background:#2449c6;color:white}.item{border-top:1px solid #e7eaf0;padding:14px 0}.item:first-child{border-top:0}.meta{font-size:13px;color:#637083}a{color:#2449c6}input[type=checkbox]{width:19px;height:19px}textarea{box-sizing:border-box;width:100%;min-height:120px;border:1px solid #cad2e2;border-radius:10px;padding:12px}label{display:flex;gap:10px;align-items:start}.notice{background:#fff7df;padding:12px;border-radius:10px;font-size:13px}.hidden{display:none}</style></head><body><main><header><div><h1>🎓 ClassHub</h1><div class="muted">1年7組 · 自分専用の課題管理</div></div><span id="count"></span></header><div class="card"><div class="tabs"><button id="tasksBtn" class="active" onclick="tab('tasks')">提出物</button><button id="testsBtn" onclick="tab('tests')">テスト返却</button></div><div id="items"></div></div><div class="card"><h2>通知の取り込み</h2><p class="notice">この初期版はGmailに直接接続しません。Google認証情報やメールをGitHubへアップロードしないでください。</p><p class="muted">Classroom通知メールの本文を貼り付けて「解析して追加」を押してください。保存先はこのブラウザ内です。</p><textarea id="mail" placeholder="Google Classroom通知メールの本文を貼り付け"></textarea><div class="bar"><button onclick="add()">解析して追加</button><button onclick="exportData()">データをバックアップ</button><button onclick="document.getElementById('file').click()">バックアップを復元</button><input id="file" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><p id="status" class="muted" role="status"></p></div></main><script>
const KEY='classhub-v1';let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}let current='tasks';const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isSeven(s){const t=s.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296)).replace(/[－−ー～〜]/g,'-');if(/(?:^|[^0-9])(?:1\s*[-年]\s*7|7\s*組|1年7組|1-07)(?:[^0-9]|$)/.test(t))return true;const ranges=[...t.matchAll(/(\d{1,2})\s*[-~]\s*(\d{1,2})\s*組/g)];if(ranges.some(m=>+m[1]<=7&&7<=+m[2]))return true;if(/(?:学年連絡|文理コース|数Ⅰ\(文理\)|数A\(文理\))/.test(t)&&!/9\s*[-~]\s*17\s*組|9\s*[-~]\s*14/.test(t))return true;return false}
function tab(v){current=v;document.getElementById('tasksBtn').classList.toggle('active',v==='tasks');document.getElementById('testsBtn').classList.toggle('active',v==='tests');render()}
function render(){const items=data.filter(x=>x.type===current).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));document.getElementById('count').textContent=`未完了 ${data.filter(x=>x.type==='tasks'&&!x.done).length}件`;document.getElementById('items').innerHTML=items.length?items.map(x=>`<div class="item"><label>${x.type==='tasks'?`<input type="checkbox" ${x.done?'checked':''} onchange="toggle('${x.id}')">`:'📄'}<div><strong>${esc(x.title)}</strong><div class="meta">${esc(x.due?'期限 '+x.due:'期限未確認')} · ${esc(x.source)}</div>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">元メール</a>`:''}<div><button style="background:#eef0f6;color:#334;font-size:12px;margin-top:8px" onclick="removeItem('${x.id}')">削除</button></div></div></label></div>`).join(''):'<p class="muted">まだ登録がありません。</p>'}
function toggle(id){const x=data.find(x=>x.id===id);if(x){x.done=!x.done;save();render()}}function removeItem(id){data=data.filter(x=>x.id!==id);save();render()}
function add(){const raw=document.getElementById('mail').value.trim(),status=document.getElementById('status');if(!raw){status.textContent='メール本文を入力してください';return}if(!isSeven(raw)){status.textContent='7組対象と確認できないため追加しませんでした。学年共通メールなどはクラス表記を確認してください。';return}const test=raw.includes('この課題はデジタル採点支援システムを使用した');const m=raw.match(/(?:新しい課題|新しい資料|新しいお知らせ)[:：]?\s*[「『]([^」』\n]+)/);const title=m?m[1]:raw.split('\n').find(s=>s.trim()&&!/通知設定/.test(s))?.slice(0,90)||'名称未確認';const due=raw.match(/(?:提出期限|提出締切|締め切り|締切|期限)[:：\s]*([^\n。]{1,35})/)?.[1]||'';const id=crypto.randomUUID();if(data.some(x=>x.title===title&&x.type===(test?'tests':'tasks'))){status.textContent='同じ名前の通知が登録済みです';return}data.push({id,type:test?'tests':'tasks',title,due,source:'メールから手動取り込み',done:false});save();render();status.textContent=test?'テスト返却として追加しました':'提出物候補として追加しました。内容を確認してください。';document.getElementById('mail').value=''}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='classhub-backup.json';a.click();URL.revokeObjectURL(url)}async function importData(e){const f=e.target.files[0];if(!f)return;try{const a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(x=>typeof x.id==='string'&&['tasks','tests'].includes(x.type)&&typeof x.title==='string'))throw Error();data=a;save();render();document.getElementById('status').textContent='復元しました'}catch{document.getElementById('status').textContent='バックアップの形式が正しくありません'}}render();</script><script>if ("serviceWorker" in navigator) {window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn));}</script></body></html>
